<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1b30" />
<meta name="color-scheme" content="dark" />
<title>砭石宝箱模拟器 · CY</title>
<meta name="description" content="天涯明月刀 OL 砭石宝箱开箱模拟：单次 50、十连 500 碎片，记录出货与消耗，纯本地随机。" />
<meta property="og:title" content="砭石宝箱模拟器 · CY" />
<meta property="og:type" content="website" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<style>
:root{
  --ink:#0a1b30;--ink-2:#071322;
  --panel:#0d2340;--panel-2:#102a4a;
  --line:#1d3d63;--line-2:#23496f;
  --gold:#ffdd95;--gold-dim:#c9a961;
  --fog:#f8fbff;--mist:#bddaf1;--dim:#7f9ab8;
  --orange:#ff9a3c;--orange-hi:#ffd0a0;
  --ok:#9fe6c2;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--fog);font-family:var(--sans);
  background:
    radial-gradient(120% 55% at 50% 0%, rgba(60,120,190,.16) 0%, transparent 60%),
    linear-gradient(180deg,#071322 0%,#0a1b30 40%,#0c2137 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,3vw,28px);
  background:rgba(7,19,34,.9);
  backdrop-filter:blur(14px);
  border-bottom:2px solid var(--line);
}
.topbar a.home{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 11px 6px 7px;
  border:2px solid var(--line-2);border-radius:999px;
  color:var(--mist);font-size:13px;text-decoration:none;
  transition:color .14s,border-color .14s,background .14s;flex-shrink:0;
}
.topbar a.home:hover{color:var(--gold);border-color:rgba(255,221,149,.5);background:rgba(255,221,149,.07)}
.topbar a.home:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar__brand{display:flex;align-items:baseline;gap:8px;margin-left:2px;min-width:0}
.topbar__brand b{font-size:14px;letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.topbar__brand span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__right{margin-left:auto;font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}

/* ---------- 布局 ---------- */
.shell{
  width:min(1000px,100%);margin:0 auto;
  padding:clamp(18px,4vw,34px) clamp(12px,3vw,24px) 80px;
}
.head{text-align:center;margin-bottom:clamp(16px,3vw,26px)}
.head .eyebrow{
  margin:0 0 8px;font-size:11px;letter-spacing:.22em;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.head .eyebrow i{width:34px;height:2px;background:var(--line-2);display:inline-block}
.head h1{
  margin:0 0 8px;font-size:clamp(22px,4.6vw,34px);letter-spacing:.04em;font-weight:700;
}
.head .sub{margin:0;font-size:12.5px;color:var(--dim);letter-spacing:.04em}

/* 碎片余额 */
.wallet{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:0 auto 18px;padding:10px 18px;
  width:fit-content;
  background:rgba(13,35,64,.7);
  border:2px solid var(--line);
  font-size:13px;color:var(--mist);
}
.wallet strong{
  font-family:var(--mono);font-size:19px;color:var(--gold);letter-spacing:.02em;
}
.wallet strong.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.wallet__gem{
  width:14px;height:14px;flex-shrink:0;
  background:linear-gradient(150deg,#8fd8ff,#3a86c8);
  transform:rotate(45deg);
  border:1px solid rgba(255,255,255,.4);
}

/* 开箱按钮 */
.actions{display:flex;gap:14px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.draw{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:132px;padding:14px 22px;
  font-family:inherit;cursor:pointer;
  color:var(--fog);
  background:linear-gradient(180deg,#1a3a5e,#102a4a);
  border:2px solid var(--line-2);
  transition:transform .12s,border-color .16s,background .16s,box-shadow .16s;
}
.draw:hover:not(:disabled){
  border-color:rgba(255,221,149,.55);
  background:linear-gradient(180deg,#20456e,#123050);
  box-shadow:0 0 0 1px rgba(255,221,149,.14),0 6px 18px rgba(0,0,0,.34);
  transform:translateY(-2px);
}
.draw:active:not(:disabled){transform:translateY(1px)}
.draw:disabled{opacity:.45;cursor:not-allowed}
.draw:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.draw__count{font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--gold)}
.draw__label{font-size:12.5px;color:var(--mist)}
.draw__cost{font-size:11px;color:var(--dim);font-family:var(--mono)}
.draw--ten{
  background:linear-gradient(180deg,#6b5320,#4a3714);
  border-color:rgba(255,221,149,.6);
}
.draw--ten:hover:not(:disabled){
  background:linear-gradient(180deg,#7d6126,#553f17);
  border-color:var(--gold);
}
.draw--ten .draw__count{color:#fff3cf}

/* 结果区 */
.stage{
  position:relative;
  min-height:190px;
  padding:clamp(16px,3vw,26px) clamp(12px,2.5vw,22px);
  background:rgba(9,24,42,.55);
  border:2px solid var(--line);
  margin-bottom:16px;
  overflow:hidden;
}
.stage__idle{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--dim);letter-spacing:.14em;
}
.stage.is-empty .stage__idle{display:flex}
.stage:not(.is-empty) .stage__idle{display:none}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;
}
@media(min-width:720px){
  .cards{grid-template-columns:repeat(5,1fr);gap:12px}
}
.card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px 9px;
  background:linear-gradient(180deg,rgba(20,45,75,.9),rgba(12,30,52,.9));
  border:2px solid var(--line-2);
  opacity:0;
  transform:translateY(10px) scale(.94);
  animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2) forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
.card__img{
  width:52px;height:52px;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.card__name{
  font-size:11.5px;line-height:1.3;text-align:center;
  color:var(--mist);
  word-break:break-all;
}
.card__stars{display:flex;gap:2px;height:9px}
.card__stars i{
  width:9px;height:9px;
  background:var(--gold-dim);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  display:block;
}
/* 稀有度边框 */
.card--g3{border-color:rgba(255,221,149,.75);box-shadow:inset 0 0 14px rgba(255,221,149,.14)}
.card--o{
  border-color:var(--orange);
  box-shadow:inset 0 0 18px rgba(255,154,60,.24),0 0 12px rgba(255,154,60,.18);
}
.card--op{
  border-color:#ffe0a8;
  background:linear-gradient(180deg,rgba(84,52,14,.94),rgba(38,24,8,.94));
  box-shadow:inset 0 0 22px rgba(255,190,90,.3),0 0 20px rgba(255,170,60,.4);
  animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2) forwards,glow 1.6s ease-in-out infinite alternate;
}
@keyframes glow{
  from{box-shadow:inset 0 0 18px rgba(255,190,90,.24),0 0 12px rgba(255,170,60,.3)}
  to{box-shadow:inset 0 0 30px rgba(255,200,110,.42),0 0 26px rgba(255,180,70,.55)}
}
.card--o .card__name{color:#ffd7ab}
.card--op .card__name{color:#fff0cf;font-weight:600}

/* 出货横幅 */
.banner{
  position:relative;
  margin:0 0 14px;
  max-height:0;
  overflow:hidden;
  padding:0 14px;
  font-size:12.5px;letter-spacing:.1em;text-align:center;
  color:#fff3cf;
  background:linear-gradient(90deg,transparent,rgba(255,154,60,.9),transparent);
  opacity:0;
  transition:max-height .24s ease,opacity .22s,padding .24s;
  pointer-events:none;
}
.banner.is-on{max-height:44px;padding:9px 14px;opacity:1}
.banner--premium{background:linear-gradient(90deg,transparent,rgba(255,205,120,.95),transparent);color:#3a2200;font-weight:700}

/* 统计与记录 */
.panel{
  background:rgba(13,35,64,.5);
  border:2px solid var(--line);
  margin-bottom:14px;
}
.panel__head{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
}
.panel__head h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:600}
.panel__head i{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.panel__body{padding:12px 14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{
  padding:10px;text-align:center;
  background:rgba(9,24,42,.6);
  border:1px solid var(--line);
}
.stat dt{font-size:11px;color:var(--dim);margin-bottom:4px}
.stat dd{margin:0;font-size:16px;font-family:var(--mono);color:var(--fog)}
.stat dd.hl{color:var(--gold)}

.rates{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rate{
  padding:3px 9px;font-size:11px;
  border:1px solid var(--line-2);color:var(--dim);
}
.rate b{color:var(--gold);font-family:var(--mono)}

.logs{max-height:210px;overflow:auto}
.log{
  display:flex;align-items:center;gap:10px;
  padding:7px 0;
  border-bottom:1px solid rgba(29,61,99,.5);
  font-size:12px;
}
.log:last-child{border-bottom:none}
.log__time{color:var(--dim);font-family:var(--mono);font-size:11px;flex-shrink:0}
.log__txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mist)}
.log__best{font-size:11px;flex-shrink:0}
.log__best--op{color:#ffe0a8;font-weight:600}
.log__best--o{color:var(--orange)}
.log__best--none{color:var(--dim)}
.empty-log{padding:14px 0;text-align:center;font-size:12px;color:var(--dim)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;font-family:inherit;font-size:12.5px;line-height:1;
  color:var(--mist);background:#12304f;border:2px solid var(--line-2);
  cursor:pointer;transition:background .14s,color .14s,border-color .14s;
  white-space:nowrap;
}
.btn:hover{background:#17406a;color:var(--fog)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn--ghost{background:transparent}
input[type=number]{
  width:104px;padding:8px 10px;
  font-family:var(--mono);font-size:13px;text-align:right;
  color:var(--gold);background:var(--ink-2);
  border:2px solid var(--line-2);
}
input[type=number]:focus{outline:2px solid var(--gold);outline-offset:1px}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

.toast{
  position:fixed;left:50%;bottom:36px;
  transform:translate(-50%,20px);
  padding:10px 20px;font-size:13px;
  color:var(--gold);background:#10294a;border:2px solid var(--gold);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:90;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

.foot{
  margin-top:26px;padding-top:16px;
  border-top:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  font-size:11.5px;color:var(--dim);line-height:1.9;
}
.foot a{color:var(--mist);text-decoration:none;border-bottom:1px dashed rgba(189,218,241,.3)}
.foot a:hover{color:var(--gold);border-bottom-color:var(--gold)}

@media(max-width:640px){
  .topbar__right{display:none}
  .draw{min-width:112px;padding:12px 16px}
  .draw__count{font-size:17px}
  .cards{grid-template-columns:repeat(3,1fr);gap:8px}
  .card__img{width:44px;height:44px}
  .card__name{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  .card,.card--op{animation:none;opacity:1;transform:none}
  .card--op{animation:none}
  .wallet strong.pop{animation:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="home" href="../index.html" title="返回大厅" aria-label="返回大厅">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    大厅
  </a>
  <div class="topbar__brand">
    <b>STONE BOX</b>
    <span>/ 砭石宝箱模拟</span>
  </div>
  <div class="topbar__right">CY · STONE SIMULATOR</div>
</header>

<main class="shell">

  <section class="head">
    <p class="eyebrow"><i></i>还有谁敢赌石头<i></i></p>
    <h1>来杯好茶摇一摇</h1>
    <p class="sub">单次 50 碎片 · 十连 500 碎片 · 纯本地随机，不联网</p>
  </section>

  <div class="wallet">
    <span class="wallet__gem" aria-hidden="true"></span>
    <span>当前剩余</span>
    <strong id="balance">5000</strong>
    <span>碎片</span>
  </div>

  <div class="actions">
    <button class="draw" id="drawOne" type="button">
      <span class="draw__count">×1</span>
      <span class="draw__label">开启 1 次</span>
      <span class="draw__cost">50 碎片</span>
    </button>
    <button class="draw draw--ten" id="drawTen" type="button">
      <span class="draw__count">×10</span>
      <span class="draw__label">开启 10 次</span>
      <span class="draw__cost">500 碎片</span>
    </button>
  </div>

  <div class="stage is-empty" id="stage">
    <div class="stage__idle" id="idle">咕噜灵波 ~</div>
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="cards" id="cards"></div>
  </div>

  <section class="panel">
    <div class="panel__head"><h2>抽卡统计</h2><i></i></div>
    <div class="panel__body">
      <dl class="stats">
        <div class="stat"><dt>累计抽取</dt><dd id="sDraws">0</dd></div>
        <div class="stat"><dt>累计消耗</dt><dd id="sSpent">0</dd></div>
        <div class="stat"><dt>神品出货</dt><dd class="hl" id="sOrange">0</dd></div>
        <div class="stat"><dt>二级神品</dt><dd class="hl" id="sPremium">0</dd></div>
      </dl>
      <div class="rates" id="rates"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel__head"><h2>抽取记录</h2><i></i>
      <button class="btn btn--ghost" id="btnClearHist" type="button" style="padding:4px 10px;font-size:11.5px">清空</button>
    </div>
    <div class="logs" id="logs">
      <div class="empty-log">还没有记录</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel__head"><h2>补充碎片</h2><i></i></div>
    <div class="panel__body">
      <div class="tools">
        <input type="number" id="fragAdd" min="1" step="100" value="5000" aria-label="补充碎片数量" />
        <button class="btn" id="btnAdd" type="button">补充</button>
        <button class="btn btn--ghost" id="btnReset" type="button">重置全部</button>
      </div>
    </div>
  </section>

  <footer class="foot">
    <div>
      收录 <b id="cntStones">—</b> 种砭石，概率为抽样估算，仅供娱乐。<br />
      数据只存在本机浏览器，不上传。
    </div>
    <div><a href="../index.html">← 返回大厅</a></div>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var LS = 'cy:stone:v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function fmt(n) { return (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('en-US'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var toastEl = $('#toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2200);
  }

  // ---------- 配置 ----------
  var DATA = null;
  var pool = {};       // rarity -> [stone]
  var state = {
    balance: 5000,
    draws: 0,
    spent: 0,
    orange: 0,
    premium: 0,
    history: []        // {t: 时间, count, best, names}
  };

  function load() {
    try {
      var raw = localStorage.getItem(LS);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          state.balance = Number(o.balance) || 0;
          state.draws = Number(o.draws) || 0;
          state.spent = Number(o.spent) || 0;
          state.orange = Number(o.orange) || 0;
          state.premium = Number(o.premium) || 0;
          state.history = Array.isArray(o.history) ? o.history.slice(0, 60) : [];
        }
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- 抽取 ----------
  function pickRarity() {
    var r = DATA.rates, t = 0, roll = Math.random() * 100;
    var keys = ['GOLD_2', 'GOLD_3', 'ORANGE', 'ORANGE_PREMIUM'];
    for (var i = 0; i < keys.length; i++) {
      t += r[keys[i]];
      if (roll < t) return keys[i];
    }
    return 'GOLD_2';
  }
  function drawOne() {
    var rar = pickRarity();
    var list = pool[rar] || pool.GOLD_2;
    return list[Math.floor(Math.random() * list.length)];
  }

  var RANK = { GOLD_2: 0, GOLD_3: 1, ORANGE: 2, ORANGE_PREMIUM: 3 };
  var CLS = { GOLD_2: '', GOLD_3: 'card--g3', ORANGE: 'card--o', ORANGE_PREMIUM: 'card--op' };

  function stars(n) {
    var s = '';
    for (var i = 0; i < n; i++) s += '<i></i>';
    return s;
  }

  function renderCards(results) {
    var stage = $('#stage'), cards = $('#cards');
    stage.classList.remove('is-empty');
    // 稀有度高的排前面
    var sorted = results.slice().sort(function (a, b) { return RANK[b.r] - RANK[a.r]; });
    cards.innerHTML = sorted.map(function (s, i) {
      return '<div class="card ' + CLS[s.r] + '" style="animation-delay:' + (i * 70) + 'ms">' +
        '<img class="card__img" src="./' + esc(s.icon) + '" alt="' + esc(s.name) + '" width="52" height="52" loading="eager" />' +
        '<div class="card__name">' + esc(s.name) + '</div>' +
        '<div class="card__stars">' + stars(s.stars) + '</div>' +
      '</div>';
    }).join('');
  }

  function showBanner(results) {
    var b = $('#banner');
    var hasOp = results.some(function (x) { return x.r === 'ORANGE_PREMIUM'; });
    var hasO = results.some(function (x) { return x.r === 'ORANGE'; });
    if (hasOp) {
      var nm = results.filter(function (x) { return x.r === 'ORANGE_PREMIUM'; })[0].name;
      b.className = 'banner banner--premium is-on';
      b.textContent = '五蕴石灵现世 · ' + nm;
    } else if (hasO) {
      b.className = 'banner is-on';
      b.textContent = '橙光乍现';
    } else {
      b.className = 'banner';
      b.textContent = '';
      return;
    }
    setTimeout(function () { b.classList.remove('is-on'); }, 2600);
  }

  function refreshStats() {
    $('#sDraws').textContent = fmt(state.draws);
    $('#sSpent').textContent = fmt(state.spent);
    $('#sOrange').textContent = fmt(state.orange);
    $('#sPremium').textContent = fmt(state.premium);
    var w = $('#balance');
    w.textContent = fmt(state.balance);
    w.classList.remove('pop');
    void w.offsetWidth;
    w.classList.add('pop');
  }

  function bestOf(results) {
    var best = results.reduce(function (a, b) { return RANK[b.r] > RANK[a.r] ? b : a; }, results[0]);
    return best;
  }

  function renderLogs() {
    var box = $('#logs');
    if (!state.history.length) {
      box.innerHTML = '<div class="empty-log">还没有记录</div>';
      return;
    }
    box.innerHTML = state.history.map(function (h) {
      var cls = h.best === 'ORANGE_PREMIUM' ? 'log__best--op'
              : (h.best === 'ORANGE' ? 'log__best--o' : 'log__best--none');
      var label = h.best === 'ORANGE_PREMIUM' ? '二级神品'
                : (h.best === 'ORANGE' ? '神品'
                : (h.best === 'GOLD_3' ? '3星' : '2星'));
      return '<div class="log">' +
        '<span class="log__time">' + esc(h.t) + '</span>' +
        '<span class="log__txt">' + esc(h.count) + ' 连 · ' + esc(h.names) + '</span>' +
        '<span class="log__best ' + cls + '">' + label + '</span>' +
      '</div>';
    }).join('');
  }

  var busy = false;
  function doDraw(count) {
    if (busy) return;
    var cost = count * DATA.cost;
    if (state.balance < cost) {
      toast('碎片不足，本次需要 ' + fmt(cost) + ' 个');
      return;
    }
    busy = true;
    $('#drawOne').disabled = true;
    $('#drawTen').disabled = true;

    var results = [];
    for (var i = 0; i < count; i++) results.push(drawOne());

    state.balance -= cost;
    state.spent += cost;
    state.draws += count;
    results.forEach(function (s) {
      if (s.r === 'ORANGE') state.orange++;
      if (s.r === 'ORANGE_PREMIUM') state.premium++;
    });

    var best = bestOf(results);
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var showNames = results.slice(0, 3).map(function (x) { return x.name; }).join('、');
    if (results.length > 3) showNames += ' 等';
    state.history.unshift({ t: hh, count: count, best: best.r, names: showNames });
    state.history = state.history.slice(0, 60);

    save();
    renderCards(results);
    refreshStats();
    renderLogs();
    showBanner(results);

    setTimeout(function () {
      busy = false;
      $('#drawOne').disabled = false;
      $('#drawTen').disabled = false;
    }, Math.min(900, 260 + count * 60));
  }

  // ---------- 事件 ----------
  $('#drawOne').addEventListener('click', function () { doDraw(1); });
  $('#drawTen').addEventListener('click', function () { doDraw(10); });

  $('#btnAdd').addEventListener('click', function () {
    var n = Math.max(1, Math.floor(Number($('#fragAdd').value) || 0));
    state.balance += n;
    save();
    refreshStats();
    toast('已补充 ' + fmt(n) + ' 碎片');
  });

  $('#btnClearHist').addEventListener('click', function () {
    state.history = [];
    save();
    renderLogs();
  });

  $('#btnReset').addEventListener('click', function () {
    if (!confirm('重置碎片、统计和全部记录？')) return;
    state = { balance: DATA.start, draws: 0, spent: 0, orange: 0, premium: 0, history: [] };
    save();
    refreshStats();
    renderLogs();
    $('#stage').classList.add('is-empty');
    $('#cards').innerHTML = '';
    $('#banner').className = 'banner';
    toast('已重置');
  });

  // ---------- 启动 ----------
  function boot() {
    load();
    fetch('./data/stone.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        DATA = d;
        pool = {};
        d.stones.forEach(function (s) {
          (pool[s.r] = pool[s.r] || []).push(s);
        });
        // 概率展示
        $('#rates').innerHTML = ['ORANGE_PREMIUM', 'ORANGE', 'GOLD_3', 'GOLD_2'].map(function (k) {
          return '<span class="rate">' + esc(d.labels[k]) + ' <b>' + d.rates[k] + '%</b></span>';
        }).join('');
        $('#cntStones').textContent = d.stones.length;
        refreshStats();
        renderLogs();
      })
      .catch(function (e) {
        $('#stage').innerHTML = '<div class="stage__idle">数据加载失败：' + esc(e.message) + '</div>';
      });
  }

  boot();
})();
</script>
</body>
</html>
