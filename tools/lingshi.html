<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1b30" />
<meta name="color-scheme" content="dark" />
<title>灵势聚灵台 · CY</title>
<meta name="description" content="天涯明月刀 OL 灵势合成：配方概率速查、合成路线规划与成本计算、词条一览。" />
<meta property="og:title" content="灵势聚灵台 · CY" />
<meta property="og:type" content="website" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<style>
:root{
  --ink:#0a1b30;--ink-2:#071322;
  --panel:#0d2340;--panel-2:#102a4a;
  --line:#1d3d63;--line-2:#23496f;
  --gold:#ffdd95;--gold-dim:#c9a961;
  --orange:#ff9a3c;
  --fog:#f8fbff;--mist:#bddaf1;--dim:#7f9ab8;
  --ok:#9fe6c2;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--fog);font-family:var(--sans);
  background:
    radial-gradient(120% 55% at 50% 0%, rgba(60,120,190,.16) 0%, transparent 60%),
    linear-gradient(180deg,#071322 0%,#0a1b30 40%,#0c2137 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,3vw,28px);
  background:rgba(7,19,34,.9);backdrop-filter:blur(14px);
  border-bottom:2px solid var(--line);
}
.topbar a.home{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 11px 6px 7px;border:2px solid var(--line-2);border-radius:999px;
  color:var(--mist);font-size:13px;text-decoration:none;
  transition:color .14s,border-color .14s,background .14s;flex-shrink:0;
}
.topbar a.home:hover{color:var(--gold);border-color:rgba(255,221,149,.5);background:rgba(255,221,149,.07)}
.topbar a.home:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar__brand{display:flex;align-items:baseline;gap:8px;margin-left:2px;min-width:0}
.topbar__brand b{font-size:14px;letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.topbar__brand span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__right{margin-left:auto;font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}

.shell{width:min(1040px,100%);margin:0 auto;padding:clamp(18px,4vw,32px) clamp(12px,3vw,24px) 80px}
.head{margin-bottom:20px}
.head h1{margin:0 0 6px;font-size:clamp(21px,3.6vw,29px);letter-spacing:.03em}
.head p{margin:0;font-size:13px;line-height:1.8;color:var(--mist)}

/* 标签页 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{
  padding:9px 16px;font-family:inherit;font-size:13px;
  color:var(--dim);background:transparent;border:2px solid transparent;border-bottom:none;
  cursor:pointer;transition:color .14s,background .14s,border-color .14s;
  position:relative;top:2px;
}
.tabs button:hover{color:var(--mist)}
.tabs button.is-on{
  color:var(--gold);background:rgba(13,35,64,.7);
  border-color:var(--line);border-bottom-color:rgba(13,35,64,.7);
}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.pane{display:none}
.pane.is-on{display:block}

.panel{
  background:rgba(13,35,64,.5);border:2px solid var(--line);
  margin-bottom:14px;
}
.panel__head{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);
}
.panel__head h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:600}
.panel__head i{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.panel__body{padding:14px}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;color:var(--dim)}
select,input[type=number]{
  padding:9px 11px;font-family:inherit;font-size:13.5px;
  color:var(--fog);background:var(--ink-2);
  border:2px solid var(--line-2);min-width:130px;
}
select:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:9px 16px;font-family:inherit;font-size:13px;line-height:1;
  color:var(--mist);background:#12304f;border:2px solid var(--line-2);
  cursor:pointer;transition:background .14s,color .14s,border-color .14s;
  white-space:nowrap;
}
.btn:hover{background:#17406a;color:var(--fog)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn--gold{color:var(--gold);background:rgba(107,83,32,.55);border-color:rgba(255,221,149,.5)}
.btn--gold:hover{background:rgba(107,83,32,.85);color:var(--gold)}

/* 概率条 */
.outs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.out{
  display:grid;grid-template-columns:96px 1fr 78px;
  gap:10px;align-items:center;
}
.out__name{
  font-size:13px;color:var(--mist);
  display:flex;align-items:center;gap:6px;
}
.out__tag{
  font-size:10px;padding:1px 5px;border:1px solid var(--line-2);color:var(--dim);
}
.out__tag--o{color:var(--orange);border-color:rgba(255,154,60,.5)}
.out__bar{
  height:10px;background:var(--ink-2);border:1px solid var(--line-2);
  position:relative;overflow:hidden;
}
.out__bar i{
  position:absolute;inset:0 auto 0 0;width:0;
  background:linear-gradient(90deg,#c9a961,#ffdd95);
  transition:width .4s ease;
}
.out__bar i.is-top{background:linear-gradient(90deg,#ff9a3c,#ffd0a0)}
.out__pct{
  font-family:var(--mono);font-size:12.5px;color:var(--gold);text-align:right;
}
.hint{margin-top:12px;font-size:12px;line-height:1.8;color:var(--dim)}
.hint b{color:var(--mist)}

/* 路线步骤 */
.steps{display:flex;flex-direction:column;gap:0;margin-top:6px}
.step{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 0;border-bottom:1px solid rgba(29,61,99,.5);font-size:13px;
}
.step:last-child{border-bottom:none}
.step__no{
  width:22px;height:22px;flex-shrink:0;
  display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;
  color:var(--ink);background:var(--gold-dim);
}
.step__txt{color:var(--mist)}
.step__txt b{color:var(--fog)}
.step__cost{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.total{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:12px;padding:11px 14px;
  background:rgba(107,83,32,.3);border:2px solid rgba(255,221,149,.35);
  font-size:13px;color:var(--mist);
}
.total strong{font-family:var(--mono);font-size:18px;color:var(--gold)}

/* 词条 */
.affix-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.affix-box{background:rgba(9,24,42,.6);border:1px solid var(--line);padding:12px}
.affix-box h3{margin:0 0 10px;font-size:12.5px;color:var(--gold);letter-spacing:.06em}
.affix-box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.affix-box li{font-size:12px;line-height:1.7;color:var(--mist);padding-left:9px;position:relative}
.affix-box li::before{
  content:"";position:absolute;left:0;top:9px;
  width:4px;height:4px;background:var(--line-2);
}
.affix-box li.o{color:#ffd7ab}
.affix-box li.o::before{background:var(--orange)}

.empty{padding:22px;text-align:center;font-size:12.5px;color:var(--dim)}
.foot{
  margin-top:26px;padding-top:16px;border-top:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  font-size:11.5px;color:var(--dim);line-height:1.9;
}
.foot a{color:var(--mist);text-decoration:none;border-bottom:1px dashed rgba(189,218,241,.3)}
.foot a:hover{color:var(--gold);border-bottom-color:var(--gold)}

@media(max-width:640px){
  .topbar__right{display:none}
  .out{grid-template-columns:84px 1fr 64px;gap:7px}
  .out__name{font-size:12px}
  select,input[type=number]{min-width:112px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="home" href="../index.html" title="返回大厅" aria-label="返回大厅">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    大厅
  </a>
  <div class="topbar__brand">
    <b>LINGSHI</b>
    <span>/ 灵势聚灵台</span>
  </div>
  <div class="topbar__right">CY · FUSION WORKBENCH</div>
</header>

<main class="shell">

  <section class="head">
    <h1>灵势聚灵台</h1>
    <p>配方概率速查、合成路线与成本计算、词条一览。数据取自游戏内已验证规则，纯本地计算。</p>
  </section>

  <nav class="tabs" id="tabs">
    <button type="button" data-pane="calc" class="is-on">配方速查</button>
    <button type="button" data-pane="plan">路线规划</button>
    <button type="button" data-pane="affix">词条一览</button>
  </nav>

  <!-- ========== 配方速查 ========== -->
  <section class="pane is-on" id="pane-calc">
    <div class="panel">
      <div class="panel__head"><h2>选两个灵势</h2><i></i></div>
      <div class="panel__body">
        <div class="row">
          <div class="field">
            <label for="selA">灵势 A</label>
            <select id="selA"></select>
          </div>
          <div class="field">
            <label for="selB">灵势 B</label>
            <select id="selB"></select>
          </div>
          <button class="btn btn--gold" id="btnFuse" type="button">查配方</button>
        </div>
        <div class="outs" id="outs"></div>
        <div class="hint" id="calcHint"></div>
      </div>
    </div>
  </section>

  <!-- ========== 路线规划 ========== -->
  <section class="pane" id="pane-plan">
    <div class="panel">
      <div class="panel__head"><h2>从哪到哪</h2><i></i></div>
      <div class="panel__body">
        <div class="row">
          <div class="field">
            <label for="selFrom">起点灵势</label>
            <select id="selFrom"></select>
          </div>
          <div class="field">
            <label for="selTo">目标灵势</label>
            <select id="selTo"></select>
          </div>
          <button class="btn btn--gold" id="btnPlan" type="button">算路线</button>
        </div>
        <div id="planOut"></div>
      </div>
    </div>
  </section>

  <!-- ========== 词条 ========== -->
  <section class="pane" id="pane-affix">
    <div class="panel">
      <div class="panel__head"><h2>词条一览</h2><i></i></div>
      <div class="panel__body">
        <div class="affix-grid" id="affixOut"></div>
        <div class="hint">橙色词条为高阶词条，数值随灵势等级变化，此处为满级参考值。</div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <div>
      收录 <b id="cntStates">—</b> 种灵势、<b id="cntFusion">—</b> 种合成组合、<b id="cntPlans">—</b> 条路线。<br />
      概率为基础值（不投币），投币上限见配方详情。
    </div>
    <div><a href="../index.html">← 返回大厅</a></div>
  </footer>

</main>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmt = function (n) {
    return (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('en-US');
  };

  var DATA = null;
  var NAME = {};      // id -> 名字
  var RANK = {};      // id -> 稀有度分

  function keyOf(a, b) {
    return a <= b ? a + '|' + b : b + '|' + a;
  }

  function fillSelect(sel, list, val) {
    sel.innerHTML = list.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === val ? ' selected' : '') + '>' +
        esc(s.name) + '</option>';
    }).join('');
  }

  // ---------- 配方 ----------
  function doFuse() {
    var a = $('#selA').value, b = $('#selB').value;
    var k = keyOf(a, b);
    var row = DATA.fusion[k];
    var box = $('#outs'), hint = $('#calcHint');
    if (!row) {
      box.innerHTML = '<div class="empty">这个组合没有记录（可能存在非法搭配）</div>';
      hint.textContent = '';
      return;
    }
    var max = row[0], outs = row[1];
    // 概率降序？不，按稀有度升序更好读
    var sorted = outs.slice().sort(function (x, y) {
      return (RANK[x[0]] || 0) - (RANK[y[0]] || 0);
    });
    box.innerHTML = sorted.map(function (o) {
      var id = o[0], p = o[1];
      var isO = /^O/.test(id);
      return '<div class="out">' +
        '<span class="out__name">' + esc(NAME[id] || id) +
          (isO ? '<span class="out__tag out__tag--o">橙</span>' : '') + '</span>' +
        '<span class="out__bar"><i class="' + (isO ? 'is-top' : '') + '" style="width:' + p + '%"></i></span>' +
        '<span class="out__pct">' + (p % 1 === 0 ? p : p.toFixed(2)) + '%</span>' +
      '</div>';
    }).join('');

    var top = outs.reduce(function (x, y) { return (RANK[y[0]] || 0) > (RANK[x[0]] || 0) ? y : x; }, outs[0]);
    hint.innerHTML = '投币上限 <b>' + fmt(max) + '</b> 灵运币；投满时必出 <b>' + esc(NAME[top[0]] || top[0]) +
      '</b>。以上为该组合<b>不投币</b>时的基础概率。';
  }

  // ---------- 路线 ----------
  function doPlan() {
    var f = $('#selFrom').value, t = $('#selTo').value;
    var box = $('#planOut');
    if (f === t) {
      box.innerHTML = '<div class="empty">起点和目标一样，不用合</div>';
      return;
    }
    var p = DATA.plans[f + '>' + t];
    if (!p) {
      box.innerHTML = '<div class="empty">没有从「' + esc(NAME[f]) + '」到「' + esc(NAME[t]) +
        '」的合成路线（可能是降级或不可达）</div>';
      return;
    }
    var total = p[0], steps = p[1];
    box.innerHTML = '<div class="steps">' + steps.map(function (s, i) {
      return '<div class="step">' +
        '<span class="step__no">' + (i + 1) + '</span>' +
        '<span class="step__txt"><b>' + esc(NAME[s[0]] || s[0]) + '</b> + ' +
          esc(NAME[s[1]] || s[1]) + ' → <b>' + esc(NAME[s[2]] || s[2]) + '</b></span>' +
        '<span class="step__cost">' + fmt(s[3]) + ' 币</span>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="total"><span>合计消耗</span><strong>' + fmt(total) + ' 灵运币</strong></div>';
  }

  // ---------- 词条 ----------
  function renderAffix() {
    var labels = { atk: '攻击向词条', def: '防御向词条' };
    var box = $('#affixOut');
    var html = '';
    Object.keys(DATA.affix).forEach(function (side) {
      var g = DATA.affix[side];
      html += '<div class="affix-box"><h3>' + esc(labels[side] || side) + '</h3><ul>';
      ['orange', 'gold'].forEach(function (tier) {
        (g[tier] || []).forEach(function (txt) {
          html += '<li class="' + (tier === 'orange' ? 'o' : '') + '">' + esc(txt) + '</li>';
        });
      });
      html += '</ul></div>';
    });
    box.innerHTML = html || '<div class="empty">暂无词条数据</div>';
  }

  // ---------- 启动 ----------
  function boot() {
    fetch('./data/lingshi.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        DATA = d;
        d.states.forEach(function (s) {
          NAME[s.id] = s.name;
          RANK[s.id] = (s.o || 0) * 100 + (s.g || 0);
        });
        var list = d.states.slice();
        fillSelect($('#selA'), list, 'G1');
        fillSelect($('#selB'), list, 'G1');
        fillSelect($('#selFrom'), list, 'G1');
        fillSelect($('#selTo'), list, 'G5');
        $('#cntStates').textContent = d.states.length;
        $('#cntFusion').textContent = Object.keys(d.fusion).length;
        $('#cntPlans').textContent = Object.keys(d.plans).length;
        doFuse();
        doPlan();
        renderAffix();
      })
      .catch(function (e) {
        $('#outs').innerHTML = '<div class="empty">数据加载失败：' + esc(e.message) + '</div>';
      });
  }

  // 标签页
  $$('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      $$('#tabs button').forEach(function (x) { x.classList.remove('is-on'); });
      b.classList.add('is-on');
      $$('.pane').forEach(function (p) { p.classList.remove('is-on'); });
      var pane = $('#pane-' + b.getAttribute('data-pane'));
      if (pane) pane.classList.add('is-on');
    });
  });

  $('#btnFuse').addEventListener('click', doFuse);
  $('#selA').addEventListener('change', doFuse);
  $('#selB').addEventListener('change', doFuse);
  $('#btnPlan').addEventListener('click', doPlan);
  $('#selFrom').addEventListener('change', doPlan);
  $('#selTo').addEventListener('change', doPlan);

  boot();
})();
</script>
</body>
</html>
